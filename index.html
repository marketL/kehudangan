<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户档案-新增</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; padding: 20px; }
        .container { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; }

        .page-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }

        /* 区块标题 */
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #1677ff; display: flex; align-items: center; gap: 6px; }

        /* 猪舍信息条目 */
        .house-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        .house-card { border: 1px solid #e8e8e8; border-radius: 8px; padding: 16px; background: #fafbfc; position: relative; transition: all 0.2s; }
        .house-card:hover { border-color: #1677ff; box-shadow: 0 2px 8px rgba(22,119,255,0.08); }
        .house-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .house-index { font-size: 13px; color: #999; font-weight: 500; }
        .delete-btn { background: #fff; border: 1px solid #ffccc7; color: #ff4d4f; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .delete-btn:hover { background: #fff1f0; border-color: #ff4d4f; }

        /* 表单字段 */
        .form-group { margin-bottom: 14px; display: flex; align-items: flex-start; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label { width: 110px; flex-shrink: 0; text-align: right; font-size: 14px; font-weight: 500; color: #333; padding-top: 9px; padding-right: 12px; }
        .form-label .required { color: #ff4d4f; margin-right: 2px; }
        .form-content { flex: 1; min-width: 0; }

        .form-input, .form-select { width: 100%; height: 40px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #fff; }
        .form-input:focus, .form-select:focus { border-color: #1677ff; outline: none; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
        .form-input:disabled { background: #f5f5f5; color: #666; cursor: not-allowed; }

        .cascade-fields { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e8e8e8; }
        .cascade-fields.show { display: block; }

        .placeholder-hint { font-size: 12px; color: #bbb; margin-top: 4px; }

        /* 照片上传 */
        .photo-upload { display: flex; align-items: flex-start; gap: 12px; }
        .photo-box { width: 100px; height: 100px; border: 1px dashed #d9d9d9; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #999; background: #fafafa; position: relative; overflow: hidden; transition: all 0.2s; }
        .photo-box:hover { border-color: #1677ff; color: #1677ff; }
        .photo-box.has-image { border-style: solid; border-color: #d9d9d9; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-box .upload-icon { font-size: 24px; line-height: 1; margin-bottom: 4px; }
        .photo-box .upload-text { font-size: 12px; }
        .photo-remove { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(0,0,0,0.5); color: #fff; border-radius: 50%; cursor: pointer; font-size: 12px; display: none; align-items: center; justify-content: center; }
        .photo-box.has-image .photo-remove { display: flex; }
        .photo-hint { font-size: 12px; color: #999; padding-top: 4px; }

        /* 添加按钮 */
        .add-btn { padding: 6px 16px; border: 1px dashed #1677ff; background: #fff; color: #1677ff; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-left: auto; }
        .add-btn:hover { background: #e6f4ff; }
        .add-btn:disabled { color: #bbb; border-color: #d9d9d9; background: #f5f5f5; cursor: not-allowed; }

        /* 操作按钮 */
        .action-row { display: flex; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #f0f0f0; }
        .btn { flex: 1; padding: 12px 0; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1677ff; color: #fff; }
        .btn-primary:active { opacity: 0.85; }
        .btn-default { background: #fff; color: #666; border: 1px solid #d9d9d9; }
        .btn-default:active { opacity: 0.85; }

        /* 提示弹窗 */
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; opacity: 0; visibility: hidden; transition: all 0.25s; z-index: 999; }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-title">客户档案 - 新增</div>

        <div class="section-title">猪舍信息
            <button class="add-btn" id="addBtn" onclick="addHouse()">+ 添加猪舍</button>
        </div>
        <div class="house-list" id="houseList"></div>

        <div class="action-row">
            <button class="btn btn-default" onclick="cancelForm()">取消</button>
            <button class="btn btn-primary" onclick="saveForm()">保存</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 数据来源：猪场分区说明.xlsx
        const pigHouseData = {
            "配怀舍": "母猪定位栏 不锈钢栏位 / 自动饮水器 整洁水泥地面",
            "分娩舍": "产床系统 保温箱杠 / 外加热灯 仔猪活动区",
            "保育舍": "塑料漏缝地板 群养小猪 / 暖风炉 料槽地区",
            "公猪舍": "独立限位栏 成年公猪 / 采精架设备",
            "后备舍": "大群饲养 自由采食 / 年轻母猪活动空间",
            "设备区": "风机湿帘环控 自动料线 / 温控显示器"
        };
        const allTypes = Object.keys(pigHouseData);

        let houseSeq = 0;

        // 获取已被占用的类型
        function getUsedTypes(excludeIdx) {
            const used = new Set();
            document.querySelectorAll('.house-card').forEach((card, i) => {
                if (i === excludeIdx) return;
                const sel = card.querySelector('.form-select');
                if (sel && sel.value) used.add(sel.value);
            });
            return used;
        }

        // 刷新所有下拉框的可选状态
        function refreshSelectStates() {
            document.querySelectorAll('.house-card').forEach((card, idx) => {
                const sel = card.querySelector('.form-select');
                const currentValue = sel.value;
                const used = getUsedTypes(idx);
                Array.from(sel.options).forEach(opt => {
                    if (!opt.value) return;
                    if (opt.value === currentValue) {
                        opt.disabled = false;
                        opt.style.color = '#333';
                    } else if (used.has(opt.value)) {
                        opt.disabled = true;
                        opt.style.color = '#ccc';
                    } else {
                        opt.disabled = false;
                        opt.style.color = '';
                    }
                });
            });
            updateAddBtnState();
        }

        // 更新添加按钮状态
        function updateAddBtnState() {
            const total = document.querySelectorAll('.house-card').length;
            const addBtn = document.getElementById('addBtn');
            if (total >= allTypes.length) {
                addBtn.disabled = true;
                addBtn.textContent = '所有猪舍类型已添加完毕';
            } else {
                addBtn.disabled = false;
                addBtn.textContent = '+ 添加猪舍';
            }
        }

        // 添加一个猪舍条目
        function addHouse() {
            const list = document.getElementById('houseList');
            const total = list.querySelectorAll('.house-card').length;
            if (total >= allTypes.length) return;

            houseSeq++;
            const card = document.createElement('div');
            card.className = 'house-card';
            card.dataset.idx = houseSeq;
            card.innerHTML = `
                <div class="house-card-header">
                    <span class="house-index">猪舍 #${total + 1}</span>
                    <button class="delete-btn" title="删除" onclick="removeHouse(this)">×</button>
                </div>
                <div class="form-group">
                    <div class="form-label"><span class="required">*</span>猪舍类型</div>
                    <div class="form-content">
                        <select class="form-select" onchange="onTypeChange(this)">
                            <option value="">请选择猪舍类型</option>
                            ${allTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="cascade-fields">
                    <div class="form-group">
                        <div class="form-label desc-label">描述</div>
                        <div class="form-content">
                            <input type="text" class="form-input desc-input" placeholder="" />
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-label photo-label">照片</div>
                        <div class="form-content">
                            <div class="photo-upload">
                                <div class="photo-box" onclick="triggerUpload(this)">
                                    <span class="upload-icon">+</span>
                                    <span class="upload-text">上传照片</span>
                                    <img src="" alt="" style="display:none;" />
                                    <div class="photo-remove" onclick="removePhoto(event, this)">×</div>
                                </div>
                            </div>
                            <input type="file" accept="image/*" style="display:none;" onchange="handleFile(event, this)" />
                        </div>
                    </div>
                </div>
            `;
            list.appendChild(card);
            refreshSelectStates();
        }

        // 删除猪舍条目
        function removeHouse(btn) {
            const card = btn.closest('.house-card');
            card.remove();
            // 重新编号
            document.querySelectorAll('.house-card').forEach((c, i) => {
                c.querySelector('.house-index').textContent = `猪舍 #${i + 1}`;
            });
            refreshSelectStates();
        }

        // 猪舍类型变化 -> 级联带出描述与照片字段
        function onTypeChange(sel) {
            const card = sel.closest('.house-card');
            const type = sel.value;
            const cascade = card.querySelector('.cascade-fields');
            const descInput = card.querySelector('.desc-input');
            const descLabel = card.querySelector('.desc-label');
            const photoLabel = card.querySelector('.photo-label');

            if (type) {
                cascade.classList.add('show');
                const desc = pigHouseData[type];
                // 字段标签随类型动态变化：xx舍描述 / xx舍照片（xx取自excel分区名称）
                descLabel.textContent = `${type}描述`;
                photoLabel.textContent = `${type}照片`;
                descInput.placeholder = `示例：${desc}`;
            } else {
                cascade.classList.remove('show');
                descLabel.textContent = '描述';
                photoLabel.textContent = '照片';
                descInput.value = '';
                descInput.placeholder = '';
            }
            refreshSelectStates();
        }

        // 照片上传
        function triggerUpload(box) {
            if (box.classList.contains('has-image')) return;
            const fileInput = box.parentElement.parentElement.querySelector('input[type="file"]');
            fileInput.click();
        }

        function handleFile(e, input) {
            const file = e.target.files[0];
            if (!file) return;
            const box = input.parentElement.querySelector('.photo-box');
            const img = box.querySelector('img');
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.src = ev.target.result;
                img.style.display = 'block';
                box.classList.add('has-image');
                box.querySelector('.upload-icon').style.display = 'none';
                box.querySelector('.upload-text').style.display = 'none';
            };
            reader.readAsDataURL(file);
            // 重置 input 以便重复选择同一文件
            input.value = '';
        }

        function removePhoto(e, btn) {
            e.stopPropagation();
            const box = btn.closest('.photo-box');
            const img = box.querySelector('img');
            img.src = '';
            img.style.display = 'none';
            box.classList.remove('has-image');
            box.querySelector('.upload-icon').style.display = '';
            box.querySelector('.upload-text').style.display = '';
        }

        // 提示
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function saveForm() {
            const cards = document.querySelectorAll('.house-card');
            if (cards.length === 0) {
                showToast('请至少添加一个猪舍');
                return;
            }
            for (let i = 0; i < cards.length; i++) {
                const sel = cards[i].querySelector('.form-select');
                if (!sel.value) {
                    showToast(`请选择第 ${i + 1} 个猪舍的类型`);
                    return;
                }
            }
            showToast('保存成功');
        }

        function cancelForm() {
            if (confirm('确认取消？已填写内容将丢失')) {
                document.getElementById('houseList').innerHTML = '';
                updateAddBtnState();
            }
        }

        // 初始化：默认添加一个空条目
        addHouse();
    </script>
</body>
</html>
